name: CI

on:
  push:
    branches: [main]
  # NO `branches:` filter. Stacked PRs target another feature branch, not main,
  # and with a filter they ran ZERO checks while GitHub still displayed
  # "Ready to merge" — visually identical to passing. Lint/typecheck/build are
  # cheap and use no model quota, so they run on every pull request regardless
  # of base. (eval.yml stays pinned to main on purpose — see the note there.)
  pull_request:
  # Re-run without pushing. During a multi-hour Actions incident on 2026-08-06,
  # main@ec0ed06 and main@c271ecb received zero check runs and main's combined
  # status stayed `pending` — with no way to re-verify main short of an empty
  # commit. eval.yml already had this; ci.yml is the cheap one, so it has less
  # excuse not to.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches eval.yml: 22, not 20. Node ships a native WebSocket only
          # from 22, which @supabase/realtime-js requires.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The only automated guard on the chat wire format. Replays the parser
      # against synthetic streams — no network, no credentials, no model quota —
      # so unlike check:cache there is nothing keeping it out of CI.
      - name: Check stream wire format
        run: npm run check:stream

      # Guards unanswered-turn detection, which is what stops a killed function
      # from rendering as an ordinary conversation. Pure function, no I/O.
      - name: Check unanswered-turn detection
        run: npm run check:gaps

      # Guards the retrieval coverage floor (which is what stops the agent
      # citing unrelated documents for an off-corpus question) and the LaTeX
      # mapper. Pure functions over measured fixtures — no network, no
      # credentials, no model quota — so this gate runs on EVERY PR, unlike the
      # eval, which is pinned to main-targeting ones.
      - name: Check grounding and answer formatting
        run: npm run check:grounding

      - name: Build
        run: npm run build
        env:
          # Build must not require a real key; provided as a harmless placeholder.
          GEMINI_API_KEY: ci-placeholder

    <text x="620" y="530" fill="#1c1917">07-05</text><text x="800" y="530" fill="#1c1917">33</text><text x="940" y="530" fill="#1c1917">118,402</text><text x="1060" y="530" fill="#1c1917">$0.0852</text>
    <text x="620" y="552" fill="#1c1917">07-04</text><text x="800" y="552" fill="#1c1917">28</text><text x="940" y="552" fill="#1c1917">96,110</text><text x="1060" y="552" fill="#1c1917">$0.0691</text>
    <text x="620" y="574" fill="#1c1917">07-03</text><text x="800" y="574" fill="#1c1917">24</text><text x="940" y="574" fill="#1c1917">82,004</text><text x="1060" y="574" fill="#1c1917">$0.0590</text>

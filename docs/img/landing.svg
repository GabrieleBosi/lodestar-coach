<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="1200" height="760" fill="#e7e5e4"/>
  <!-- window -->
  <rect x="40" y="30" width="1120" height="700" rx="14" fill="#fafaf9" stroke="#d6d3d1"/>
  <!-- browser bar -->
  <rect x="40" y="30" width="1120" height="46" rx="14" fill="#f5f5f4"/>
  <rect x="40" y="60" width="1120" height="16" fill="#f5f5f4"/>
  <circle cx="66" cy="53" r="6" fill="#ef4444"/><circle cx="86" cy="53" r="6" fill="#f59e0b"/><circle cx="106" cy="53" r="6" fill="#22c55e"/>
  <rect x="150" y="41" width="620" height="24" rx="12" fill="#e7e5e4"/>
  <text x="168" y="58" font-size="13" fill="#78716c">lodestar-coach.netlify.app</text>

  <!-- status badge -->
  <rect x="90" y="112" width="220" height="30" rx="15" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="112" cy="127" r="5" fill="#10b981"/>
  <text x="126" y="132" font-size="13" fill="#047857">healthy · gemini-3.5-flash</text>

  <!-- hero -->
  <text x="90" y="210" font-size="58" font-weight="700" fill="#1c1917">Lodestar</text>
  <text x="90" y="256" font-size="22" fill="#57534e">An evidence-grounded AI coach for training,</text>
  <text x="90" y="286" font-size="22" fill="#57534e">nutrition &amp; recovery — cited answers, real tools,</text>
  <text x="90" y="316" font-size="22" fill="#57534e">measured quality.</text>

  <rect x="90" y="352" width="190" height="48" rx="10" fill="#059669"/>
  <text x="118" y="382" font-size="17" font-weight="600" fill="#ffffff">Try the demo →</text>
  <rect x="296" y="352" width="120" height="48" rx="10" fill="#fafaf9" stroke="#d6d3d1"/>
  <text x="326" y="382" font-size="17" font-weight="600" fill="#1c1917">Sign in</text>

  <!-- highlight cards -->
  <g>
    <rect x="90" y="452" width="330" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="112" y="490" font-size="17" font-weight="700" fill="#1c1917">Grounded &amp; cited</text>
    <text x="112" y="520" font-size="13.5" fill="#57534e">Every factual answer is retrieved from</text>
    <text x="112" y="540" font-size="13.5" fill="#57534e">a curated knowledge base and cited [n]</text>
    <text x="112" y="560" font-size="13.5" fill="#57534e">— no improvised claims.</text>
  </g>
  <g>
    <rect x="438" y="452" width="330" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="460" y="490" font-size="17" font-weight="700" fill="#1c1917">Agentic tools</text>
    <text x="460" y="520" font-size="13.5" fill="#57534e">It logs your workouts, reads your</text>
    <text x="460" y="540" font-size="13.5" fill="#57534e">history, and computes safe energy</text>
    <text x="460" y="560" font-size="13.5" fill="#57534e">targets — not just chat.</text>
  </g>
  <g>
    <rect x="786" y="452" width="330" height="150" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="808" y="490" font-size="17" font-weight="700" fill="#1c1917">Evaluated &amp; safe</text>
    <text x="808" y="520" font-size="13.5" fill="#57534e">A golden-set eval scores faithfulness,</text>
    <text x="808" y="540" font-size="13.5" fill="#57534e">citations, and safety on every change,</text>
    <text x="808" y="560" font-size="13.5" fill="#57534e">with safety guardrails.</text>
  </g>

  <!-- disclaimer -->
  <rect x="90" y="636" width="1026" height="52" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="112" y="668" font-size="13.5" fill="#92400e">Lodestar provides general, evidence-based information and is NOT medical advice.</text>
</svg>
